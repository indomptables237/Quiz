<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiz Kamer">
<title>Quiz Kamer</title>
<style>
:root{--bg:#f6f3ea;--card:#fff;--tx:#1b1b1b;--mut:#666;--g:#007a5e;--r:#ce1126;--y:#fcd116;--bd:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1d2621;--tx:#f1f1f1;--mut:#a9b3ad;--bd:#33403a}}
:root[data-theme="dark"]{--bg:#121815;--card:#1d2621;--tx:#f1f1f1;--mut:#a9b3ad;--bd:#33403a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
.flag{height:6px;background:linear-gradient(90deg,var(--g) 33%,var(--r) 33% 66%,var(--y) 66%)}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:28px;margin:8px 0 4px}
p{color:var(--mut);line-height:1.45}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:14px 0}
button{font:inherit;width:100%;padding:15px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);text-align:left;margin:8px 0;font-size:17px}
button.main{background:var(--g);color:#fff;border-color:var(--g);text-align:center;font-weight:700}
button.wa{background:#1fa855;color:#fff;border-color:#1fa855;text-align:center;font-weight:700}
button.ok{background:#0a8a4a;color:#fff;border-color:#0a8a4a}
button.ko{background:var(--r);color:#fff;border-color:var(--r)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:8px}
.q{font-size:20px;font-weight:700;line-height:1.3;margin:10px 0}
.ad{min-height:100px;border:1px dashed var(--bd);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;margin:14px 0}
.big{font-size:56px;font-weight:800;text-align:center;margin:6px 0}
</style>
</head>
<body>
<div class="flag"></div>
<main id="app"></main>
<script>
// === PUBLICITÉ ===
// Après avoir hébergé ce fichier sur ton propre site et obtenu ton compte AdSense,
// ajoute le script AdSense dans <head> et remplace le contenu de chaque <div class="ad"> par ton bloc <ins class="adsbygoogle">.
var AD='<div class="ad">Espace publicitaire</div>';

var Q=[
["Quelle est la capitale du Cameroun ?",["Douala","Yaoundé","Garoua","Bafoussam"],1],
["Quelle est la capitale économique du Cameroun ?",["Yaoundé","Douala","Limbé","Kribi"],1],
["Quelle monnaie utilise-t-on au Cameroun ?",["Naira","Franc CFA","Cedi","Euro"],1],
["Quel est le plus haut sommet du Cameroun ?",["Mont Cameroun","Mont Oku","Mont Kupe","Mont Manengouba"],0],
["Quel est le surnom de l’équipe nationale de football ?",["Les Éléphants","Les Lions Indomptables","Les Aigles","Les Super Eagles"],1],
["En quelle année le Cameroun a-t-il atteint les quarts de finale de la Coupe du monde ?",["1982","1990","1998","2002"],1],
["Quel est le plus long fleuve du Cameroun ?",["Wouri","Sanaga","Logone","Bénoué"],1],
["Quelles sont les langues officielles du Cameroun ?",["Français et anglais","Français et arabe","Anglais et espagnol","Français et portugais"],0],
["En quelle année le Cameroun français a-t-il obtenu son indépendance ?",["1957","1960","1961","1972"],1],
["Quel océan borde le Cameroun ?",["Indien","Atlantique","Pacifique","Arctique"],1],
["Lequel de ces pays n’est PAS voisin du Cameroun ?",["Tchad","Gabon","Nigeria","Ghana"],3],
["Combien de régions compte le Cameroun ?",["8","10","12","7"],1],
["Quel plat est une spécialité camerounaise ?",["Ndolé","Thiéboudienne","Poulet yassa","Alloco"],0],
["Combien de fois Samuel Eto’o a-t-il remporté le Ballon d’or africain ?",["2","3","4","5"],2],
["Combien de CAN le Cameroun a-t-il remportées ?",["3","4","5","6"],2],
["Quelle est la capitale du Nigeria ?",["Lagos","Abuja","Kano","Ibadan"],1],
["Quel est le plus grand océan du monde ?",["Atlantique","Indien","Pacifique","Arctique"],2],
["Combien de continents y a-t-il ?",["5","6","7","8"],2],
["Quelle planète est surnommée la planète rouge ?",["Vénus","Mars","Jupiter","Saturne"],1],
["Combien font 8 × 7 ?",["54","56","58","64"],1],
["Quel est l’animal terrestre le plus rapide ?",["Lion","Guépard","Antilope","Cheval"],1],
["Quel est le plus grand pays d’Afrique par sa superficie ?",["Algérie","RDC","Soudan","Libye"],0],
["Quelle est la formule chimique de l’eau ?",["CO2","H2O","O2","NaCl"],1],
["Quel est le plus long fleuve d’Afrique ?",["Congo","Niger","Nil","Zambèze"],2]
];
var N=10,qs,i,score,streak,best=0,app=document.getElementById("app");
try{best=parseInt(localStorage.getItem("qk-best")||"0")||0}catch(e){}

function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}

function home(){
  app.innerHTML='<h1>Quiz Kamer 🇨🇲</h1><p>10 questions sur le Cameroun et le monde. Tu peux faire mieux que tes amis ?</p>'
  +'<div class="card"><div class="meta"><span>Meilleur score</span><b>'+best+' / '+N+'</b></div></div>'
  +'<button class="main" id="go">Jouer</button>'+AD
  +'<p style="font-size:13px">Astuce iPhone : dans Safari, touche Partager puis « Sur l’écran d’accueil » pour installer l’appli.</p>';
  document.getElementById("go").onclick=start;
}
function start(){qs=shuffle(Q).slice(0,N);i=0;score=0;streak=0;show()}
function show(){
  var q=qs[i];
  app.innerHTML='<div class="meta"><span>Question '+(i+1)+' / '+N+'</span><span>Score : '+score+(streak>1?' 🔥'+streak:'')+'</span></div>'
  +'<div class="bar"><i style="width:'+(i/N*100)+'%"></i></div>'
  +'<div class="q">'+q[0]+'</div><div id="opts"></div><div id="fb"></div>';
  var o=document.getElementById("opts");
  q[1].forEach(function(t,k){var b=document.createElement("button");b.textContent=t;b.onclick=function(){answer(k)};o.appendChild(b)});
}
function answer(k){
  var q=qs[i],bs=document.querySelectorAll("#opts button"),good=k===q[2];
  bs.forEach(function(b,n){b.disabled=true;if(n===q[2])b.className="ok";else if(n===k)b.className="ko"});
  if(good){score++;streak++}else streak=0;
  var last=i===N-1;
  document.getElementById("fb").innerHTML='<p><b>'+(good?'Bravo ! ✅':'Raté ❌')+'</b></p>'+AD+'<button class="main" id="nx">'+(last?'Voir mon score':'Question suivante')+'</button>';
  document.getElementById("nx").onclick=function(){i++;last?end():show()};
}
function end(){
  if(score>best){best=score;try{localStorage.setItem("qk-best",String(best))}catch(e){}}
  var msg=score>=9?"Légende du Kamer ! 🦁":score>=6?"Très bien joué 👏":score>=3?"Pas mal, retente ta chance":"Courage, la revanche t’attend !";
  app.innerHTML='<div class="card"><div class="big">'+score+' / '+N+'</div><p style="text-align:center">'+msg+'</p></div>'
  +AD+'<button class="wa" id="sh">Défier mes amis sur WhatsApp</button><button class="main" id="again">Rejouer</button>';
  document.getElementById("again").onclick=start;
  document.getElementById("sh").onclick=function(){
    var t="J’ai eu "+score+"/"+N+" au Quiz Kamer 🇨🇲 Fais mieux que moi : "+location.href;
    if(navigator.share){navigator.share({text:t}).catch(function(){})}
    else{window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")}
  };
}
home();
</script>
</body>
</html>
